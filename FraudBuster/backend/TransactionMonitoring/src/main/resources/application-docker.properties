spring.application.name=TransactionMonitoring
server.port=8082

# Docker datasource - env vars injected by docker-compose, fallback to local values
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/FraudBustersDB?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:n3u3da!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicitly set dialect so Hibernate doesn't need JDBC metadata to determine it
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always

# Hikari - give MySQL container enough time to be ready
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000