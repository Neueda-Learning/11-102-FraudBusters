spring.application.name=TransactionMonitoring
server.port = 8082

# MySQL datasource
spring.datasource.url=jdbc:mysql://mysql:3306/FraudBustersDB?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicitly set dialect so Hibernate doesn't need JDBC metadata to determine it
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run schema.sql and data.sql on startup (creates tables + seeds if missing)
spring.sql.init.mode=never

# Auto evaluation of newly inserted RECEIVED/PENDING transactions
fraud.evaluation.pending.enabled=true
fraud.evaluation.pending.initial-delay-ms=5000
fraud.evaluation.pending.fixed-delay-ms=5000

